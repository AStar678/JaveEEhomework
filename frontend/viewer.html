<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>直播打赏 - 观众端</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .card { margin-bottom: 20px; }
        .tag-badge { margin-right: 5px; }
    </style>
</head>
<body>
<div id="app" class="container mt-4">
    <h2 class="mb-4">🎥 直播打赏 - 观众端</h2>

    <div class="row">
        <!-- 打赏区域 -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">💰 我要打赏</div>
                <div class="card-body">
                    <form @submit.prevent="donate">
                        <div class="mb-3">
                            <label>主播ID (1-100)</label>
                            <input type="number" v-model.number="form.anchorId" class="form-control" placeholder="请输入主播ID" required min="1" max="100" step="1">
                            <div class="form-text">系统会自动识别主播姓名和性别</div>
                        </div>
                        <div class="mb-3">
                            <label>打赏金额</label>
                            <input type="number" v-model.number="form.amount" class="form-control" required min="0.01" step="0.01">
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label>我的姓名</label>
                            <input type="text" v-model="form.viewerName" class="form-control" placeholder="请输入您的昵称" required>
                            <div class="form-text">如果是新用户，系统会自动为您注册ID</div>
                        </div>
                        <div class="mb-3">
                            <label>我的性别</label>
                            <select v-model.number="form.viewerGender" class="form-select">
                                <option value="1">男</option>
                                <option value="2">女</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">🚀 发送打赏</button>
                    </form>
                    <div v-if="donateResult" :class="['alert', 'mt-3', isError ? 'alert-danger' : 'alert-success']">{{ donateResult }}</div>
                </div>
            </div>
        </div>

        <!-- 查询区域 -->
        <div class="col-md-6">
            <!-- 个人标签 -->
            <div class="card">
                <div class="card-header bg-info text-white">🏷️ 我的标签</div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="text" v-model="queryViewerName" class="form-control" placeholder="输入观众姓名">
                        <button class="btn btn-outline-secondary" @click="getTags">查询</button>
                    </div>
                    <div v-if="tags.length > 0">
                        <span v-for="tag in tags" class="badge bg-warning text-dark tag-badge">{{ tag }}</span>
                    </div>
                    <div v-else-if="tagsSearched" class="text-muted">{{ tagMessage }}</div>
                </div>
            </div>

            <!-- 主播 Top10 -->
            <div class="card">
                <div class="card-header bg-warning text-dark">🏆 主播 Top10 观众</div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="number" v-model.number="queryAnchorId" class="form-control" placeholder="输入主播ID" min="1" max="100" step="1">
                        <button class="btn btn-outline-secondary" @click="getTopViewers">查询</button>
                    </div>
                    <ul class="list-group">
                        <li v-for="(item, index) in topViewers" class="list-group-item d-flex justify-content-between align-items-center">
                            <span>#{{ index + 1 }} {{ item.viewerName }} (ID: {{ item.viewerId }})</span>
                            <span class="badge bg-primary rounded-pill">￥{{ item.totalAmount }}</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            form: {
                anchorId: 1, 
                viewerName: '观众张三', viewerGender: 1,
                amount: 100
            },
            donateResult: '',
            isError: false,
            queryViewerName: '观众张三',
            tags: [],
            tagsSearched: false,
            tagMessage: '暂无标签',
            queryAnchorId: 1,
            topViewers: []
        },
        methods: {
            donate() {
                axios.post('http://localhost:8081/viewer/donate', this.form)
                    .then(res => {
                        if (res.data.code === 200) {
                            this.isError = false;
                            this.donateResult = res.data.message + ' (TraceId: ' + res.data.traceId + ')';
                        } else {
                            this.isError = true;
                            this.donateResult = res.data.message;
                        }
                        setTimeout(() => this.donateResult = '', 3000);
                    })
                    .catch(err => {
                        this.isError = true;
                        this.donateResult = '打赏失败: ' + (err.response ? err.response.data.message : err.message);
                    });
            },
            getTags() {
                if (!this.queryViewerName) {
                    alert('请输入观众姓名');
                    return;
                }
                this.tags = [];
                this.tagsSearched = false;
                
                axios.get(`http://localhost:8081/viewer/tags/name?viewerName=${this.queryViewerName}`)
                    .then(res => {
                        if (res.data.code === 200) {
                            this.tags = res.data.data;
                            this.tagMessage = '暂无标签';
                        } else {
                            this.tagMessage = res.data.message;
                        }
                        this.tagsSearched = true;
                    })
                    .catch(err => {
                        this.tagMessage = '查询失败: ' + err.message;
                        this.tagsSearched = true;
                    });
            },
            getTopViewers() {
                axios.get(`http://localhost:8081/viewer/top/${this.queryAnchorId}`)
                    .then(res => {
                        this.topViewers = res.data.data;
                    });
            }
        }
    });
</script>
</body>
</html>
