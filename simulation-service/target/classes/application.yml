server:
  port: 8084

spring:
  application:
    name: simulation-service
  datasource:
    # 数据库配置占位符
    url: jdbc:mysql://localhost:3306/db_simulation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: password
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true
        register-health-check: false
      config:
        enabled: false
    discovery:
      enabled: false
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    connect-timeout: 1000
    timeout: 1000

# Feign客户端配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
  httpclient:
    enabled: true

# 模拟服务配置
simulation:
  use-real-service: false  # 默认使用Mock服务，设置为true则使用真实服务
  donate:
    min-amount: 1          # 最小打赏金额
    max-amount: 1000       # 最大打赏金额
    default-gift-id: 1     # 默认礼物ID
  thread-pool:
    core-pool-size: 10     # 核心线程数
    max-pool-size: 50      # 最大线程数
    queue-capacity: 1000   # 队列容量
    keep-alive-seconds: 60 # 线程空闲时间
  scheduled:
    enable-auto-simulation: false  # 是否启用自动模拟
    initial-delay: 60000    # 初始延迟（毫秒）
    fixed-rate: 300000      # 执行频率（毫秒）

# 日志配置
logging:
  level:
    com.group.simulation: info
    org.springframework.cloud.openfeign: debug
